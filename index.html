<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatTetris</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <h1>CatTetris 🐾</h1>
    <div id="game-area">
      <div id="canvas-stack">
        <canvas id="board-canvas" width="300" height="600"></canvas>
        <!-- Wider than the board and allowed to spill past it (see
             #canvas-stack's overflow: visible) so the M4 cat paw can
             visibly reach in from beyond the play area, not just from
             its edge. -->
        <canvas id="fx-canvas" width="480" height="600"></canvas>
      </div>
      <div id="ui-panel">
        <div id="next-piece-label">Next</div>
        <canvas id="next-canvas" width="100" height="100"></canvas>
        <div id="score">Score: 0</div>
        <div id="high-score">Best: 0</div>
        <div id="affection-label">なつき度</div>
        <canvas id="affection-canvas" width="84" height="224"></canvas>
        <!-- M6: shown big + briefly whenever a cat type levels up (see
             main.js) — reuses the blank space below the gauge panel
             rather than adding a new persistent UI element. Hidden
             (opacity 0) the rest of the time. -->
        <canvas id="level-up-face" width="100" height="100"></canvas>
        <button id="restart-btn" class="hidden" type="button">Restart</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
