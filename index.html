<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatTetris</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- M8: title screen — the page's actual entry point. Shown first;
       #game-container stays hidden until "ゲームスタート" is pressed
       (see main.js). Kept as a plain sibling div (not an overlay) since
       nothing needs to render behind it while it's up. -->
  <div id="title-screen">
    <div id="title-panel">
      <h1>CatTetris 🐾</h1>
      <p id="title-tagline">ネコと遊ぶテトリス</p>
      <div id="title-buttons">
        <button id="title-start-btn" type="button">ゲームスタート</button>
        <button id="title-records-btn" type="button">これまでの記録</button>
        <button id="title-collection-btn" type="button">🐾 図鑑を見る</button>
      </div>
    </div>
  </div>

  <div id="game-container" class="hidden">
    <h1>CatTetris 🐾</h1>
    <div id="game-area">
      <div id="canvas-stack">
        <canvas id="board-canvas" width="300" height="600"></canvas>
        <!-- Wider than the board and allowed to spill past it (see
             #canvas-stack's overflow: visible) so the M4 cat paw can
             visibly reach in from beyond the play area, not just from
             its edge. -->
        <canvas id="fx-canvas" width="480" height="600"></canvas>
      </div>
      <div id="ui-panel">
        <div id="next-piece-label">Next</div>
        <canvas id="next-canvas" width="100" height="100"></canvas>
        <div id="score">Score: 0</div>
        <div id="high-score">Best: 0</div>
        <div id="affection-label">なつき度</div>
        <canvas id="affection-canvas" width="84" height="224"></canvas>
        <!-- M6: shown big + briefly whenever a cat type levels up (see
             main.js) — reuses the blank space below the gauge panel
             rather than adding a new persistent UI element. Hidden
             (opacity 0) the rest of the time. -->
        <canvas id="level-up-face" width="100" height="100"></canvas>
        <button id="collection-btn" type="button">🐾 図鑑</button>
        <button id="restart-btn" class="hidden" type="button">Restart</button>
        <!-- M8 follow-up: shown alongside Restart only on game over
             (see main.js) — returns to the title screen instead of
             starting a new game directly. -->
        <button id="back-to-title-btn" class="hidden" type="button">タイトルへ</button>
      </div>
    </div>
  </div>

  <!-- M7: cat-breed collection. A card per type (see piece.js's
       BREED_PROFILES), locked until affection.js's isCollected() says
       that breed has been met — opened on demand via the 図鑑 button
       rather than popping up during play, so it can safely pause the
       game and take its time. Clicking a card opens that breed's
       detail view (#collection-detail-view) with its full milestone
       trivia list, built in main.js from piece.js's MILESTONE_COUNTS/
       milestoneFacts rather than hand-written per breed here. -->
  <div id="collection-overlay" class="hidden">
    <div id="collection-panel">
      <button id="collection-close-btn" type="button">×</button>

      <div id="collection-grid-view">
        <div id="collection-header">猫種図鑑</div>
        <div id="collection-grid">
          <div class="collection-card" id="collection-card-I">
            <canvas class="collection-card-face" id="collection-face-I" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-I"></div>
            <div class="collection-card-personality" id="collection-personality-I"></div>
            <div class="collection-card-trivia" id="collection-trivia-I"></div>
          </div>
          <div class="collection-card" id="collection-card-O">
            <canvas class="collection-card-face" id="collection-face-O" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-O"></div>
            <div class="collection-card-personality" id="collection-personality-O"></div>
            <div class="collection-card-trivia" id="collection-trivia-O"></div>
          </div>
          <div class="collection-card" id="collection-card-T">
            <canvas class="collection-card-face" id="collection-face-T" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-T"></div>
            <div class="collection-card-personality" id="collection-personality-T"></div>
            <div class="collection-card-trivia" id="collection-trivia-T"></div>
          </div>
          <div class="collection-card" id="collection-card-S">
            <canvas class="collection-card-face" id="collection-face-S" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-S"></div>
            <div class="collection-card-personality" id="collection-personality-S"></div>
            <div class="collection-card-trivia" id="collection-trivia-S"></div>
          </div>
          <div class="collection-card" id="collection-card-Z">
            <canvas class="collection-card-face" id="collection-face-Z" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-Z"></div>
            <div class="collection-card-personality" id="collection-personality-Z"></div>
            <div class="collection-card-trivia" id="collection-trivia-Z"></div>
          </div>
          <div class="collection-card" id="collection-card-J">
            <canvas class="collection-card-face" id="collection-face-J" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-J"></div>
            <div class="collection-card-personality" id="collection-personality-J"></div>
            <div class="collection-card-trivia" id="collection-trivia-J"></div>
          </div>
          <div class="collection-card" id="collection-card-L">
            <canvas class="collection-card-face" id="collection-face-L" width="70" height="70"></canvas>
            <div class="collection-card-name" id="collection-name-L"></div>
            <div class="collection-card-personality" id="collection-personality-L"></div>
            <div class="collection-card-trivia" id="collection-trivia-L"></div>
          </div>
        </div>
      </div>

      <div id="collection-detail-view" class="hidden">
        <button id="collection-back-btn" type="button">← 戻る</button>
        <div id="collection-detail-head">
          <canvas id="collection-detail-face" width="90" height="90"></canvas>
          <div id="collection-detail-name"></div>
          <div id="collection-detail-personality"></div>
        </div>
        <div id="collection-detail-milestones"></div>
      </div>
    </div>
  </div>

  <!-- M8: "これまでの記録" — high score + cumulative play stats plus a
       compact per-breed なつき度 summary (level only; name/personality
       stay behind the 図鑑 detail page, same lock look as its cards).
       Reachable from the title screen only for now. -->
  <div id="records-overlay" class="hidden">
    <div id="records-panel">
      <button id="records-close-btn" type="button">×</button>
      <div id="records-header">これまでの記録</div>

      <div id="records-stats">
        <div class="records-stat">
          <span class="records-stat-label">ハイスコア</span>
          <span class="records-stat-value" id="records-high-score">0</span>
        </div>
        <div class="records-stat">
          <span class="records-stat-label">総プレイ回数</span>
          <span class="records-stat-value" id="records-games-played">0</span>
        </div>
        <div class="records-stat">
          <span class="records-stat-label">総ライン消去数</span>
          <span class="records-stat-value" id="records-lines-cleared">0</span>
        </div>
      </div>

      <div id="records-affection-header">猫種なつき度</div>
      <div id="records-affection-grid">
        <div class="records-affection-card" id="records-affection-card-I">
          <canvas class="records-affection-face" id="records-affection-face-I" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-I"></div>
        </div>
        <div class="records-affection-card" id="records-affection-card-O">
          <canvas class="records-affection-face" id="records-affection-face-O" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-O"></div>
        </div>
        <div class="records-affection-card" id="records-affection-card-T">
          <canvas class="records-affection-face" id="records-affection-face-T" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-T"></div>
        </div>
        <div class="records-affection-card" id="records-affection-card-S">
          <canvas class="records-affection-face" id="records-affection-face-S" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-S"></div>
        </div>
        <div class="records-affection-card" id="records-affection-card-Z">
          <canvas class="records-affection-face" id="records-affection-face-Z" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-Z"></div>
        </div>
        <div class="records-affection-card" id="records-affection-card-J">
          <canvas class="records-affection-face" id="records-affection-face-J" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-J"></div>
        </div>
        <div class="records-affection-card" id="records-affection-card-L">
          <canvas class="records-affection-face" id="records-affection-face-L" width="48" height="48"></canvas>
          <div class="records-affection-level" id="records-affection-level-L"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
